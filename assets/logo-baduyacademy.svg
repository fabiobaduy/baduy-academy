<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="txtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#48cae4"/>
      <stop offset="100%" style="stop-color:#1e6091"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0e9da"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0d1b2a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ===== ICONO: FICHA DE DOMINÓ + BIRRETE ===== -->
  <g filter="url(#shadow)">
    <!-- Ficha de dominó base -->
    <rect x="30" y="52" width="110" height="110" rx="14" fill="url(#tileGrad)" stroke="#0d1b2a" stroke-width="3"/>
    <!-- Línea divisoria -->
    <line x1="30" y1="107" x2="140" y2="107" stroke="#0d1b2a" stroke-width="3"/>
    <!-- Pips superiores (4) -->
    <circle cx="53" cy="74" r="7" fill="#0d1b2a"/>
    <circle cx="85" cy="74" r="7" fill="#0d1b2a"/>
    <circle cx="53" cy="95" r="7" fill="#0d1b2a"/>
    <circle cx="85" cy="95" r="7" fill="#0d1b2a"/>
    <!-- Pips inferiores (3) -->
    <circle cx="69" cy="125" r="7" fill="#0d1b2a"/>
    <circle cx="85" cy="141" r="7" fill="#0d1b2a"/>
    <circle cx="101" cy="125" r="7" fill="#0d1b2a"/>

    <!-- Birrete de graduación -->
    <g>
      <!-- Base del birrete (tablero) -->
      <polygon points="42,52 128,52 114,44 56,44" fill="#0d1b2a" stroke="#1b263b" stroke-width="1"/>
      <!-- Lado del birrete -->
      <polygon points="56,44 114,44 114,58 56,58" fill="#1e6091"/>
      <!-- Borla -->
      <line x1="128" y1="52" x2="140" y2="38" stroke="#c9a227" stroke-width="3" stroke-linecap="round"/>
      <circle cx="142" cy="36" r="5" fill="#c9a227"/>
      <!-- Botón central -->
      <circle cx="85" cy="48" r="4" fill="#c9a227"/>
    </g>
  </g>

  <!-- ===== TEXTO ===== -->
  <text x="165" y="105" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="44" fill="url(#txtGrad)" letter-spacing="1">BADUY</text>
  <text x="165" y="140" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" fill="#1e6091" letter-spacing="6">ACADEMY</text>

  <!-- Línea base -->
  <line x1="165" y1="152" x2="560" y2="152" stroke="#0d1b2a" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
</svg>
