<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0d1b2a" flood-opacity="0.30"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Birrete de graduación -->
    <g>
      <!-- Tablero del birrete (perspectiva romboidal) -->
      <polygon points="30,52 100,26 170,52 100,78" fill="#0d1b2a"/>
      <polygon points="30,52 100,26 170,52 100,78" fill="none" stroke="#1b263b" stroke-width="1.5"/>
      <!-- Copa/casco -->
      <polygon points="58,58 58,66 100,66 100,58 96,52 62,52" fill="#1e6091"/>
      <!-- Borla dorada -->
      <line x1="170" y1="52" x2="188" y2="30" stroke="#c9a227" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="191" cy="25" r="7" fill="#c9a227"/>
      <line x1="191" y1="32" x2="191" y2="44" stroke="#c9a227" stroke-width="2.5"/>
      <!-- Botón central -->
      <circle cx="100" cy="54" r="5" fill="#c9a227"/>
    </g>

    <!-- Ficha 2-blanca -->
    <rect x="40" y="62" width="120" height="190" rx="16" fill="#ffffff" stroke="#0d1b2a" stroke-width="4"/>
    <!-- División central -->
    <rect x="40" y="155" width="120" height="5" fill="#0d1b2a"/>
    <!-- Pips superiores (2 en diagonal: sup-izq e inf-der) -->
    <rect x="60" y="82" width="18" height="18" rx="3" fill="#0d1b2a"/>
    <rect x="122" y="120" width="18" height="18" rx="3" fill="#0d1b2a"/>
    <!-- Mitad inferior VACÍA (blanca) -->
    <!-- Borde interior sutil -->
    <rect x="47" y="69" width="106" height="176" rx="11" fill="none" stroke="#e8e0d0" stroke-width="1.5"/>
  </g>
</svg>
