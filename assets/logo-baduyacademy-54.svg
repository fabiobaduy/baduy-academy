<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220">
  <defs>
    <linearGradient id="txtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#48cae4"/>
      <stop offset="100%" style="stop-color:#1e6091"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d1b2a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- ===== BIRRETE ===== -->
    <g>
      <polygon points="38,52 93,30 148,52 93,74" fill="#0d1b2a"/>
      <polygon points="38,52 93,30 148,52 93,74" fill="none" stroke="#1b263b" stroke-width="1.5"/>
      <polygon points="63,56 63,64 93,64 93,56 90,52 66,52" fill="#1e6091"/>
      <line x1="148" y1="52" x2="162" y2="34" stroke="#c9a227" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="165" cy="30" r="6.5" fill="#c9a227"/>
      <line x1="165" y1="36" x2="165" y2="46" stroke="#c9a227" stroke-width="2.5"/>
      <circle cx="93" cy="53" r="4.5" fill="#c9a227"/>
    </g>

    <!-- ===== FICHA 5-4 ===== -->
    <rect x="33" y="58" width="120" height="155" rx="14" fill="#ffffff" stroke="#0d1b2a" stroke-width="3.5"/>
    <rect x="33" y="133" width="120" height="4.5" fill="#0d1b2a"/>
    <!-- 5 pips arriba (quincunce) -->
    <rect x="51" y="76" width="16" height="16" rx="2.5" fill="#0d1b2a"/>
    <rect x="119" y="76" width="16" height="16" rx="2.5" fill="#0d1b2a"/>
    <rect x="85" y="93" width="16" height="16" rx="2.5" fill="#0d1b2a"/>
    <rect x="51" y="110" width="16" height="16" rx="2.5" fill="#0d1b2a"/>
    <rect x="119" y="110" width="16" height="16" rx="2.5" fill="#0d1b2a"/>
    <!-- 4 pips abajo (esquinas) -->
    <rect x="51" y="148" width="16" height="16" rx="2.5" fill="#0d1b2a"/>
    <rect x="119" y="148" width="16" height="16" rx="2.5" fill="#0d1b2a"/>
    <rect x="51" y="181" width="16" height="16" rx="2.5" fill="#0d1b2a"/>
    <rect x="119" y="181" width="16" height="16" rx="2.5" fill="#0d1b2a"/>
    <rect x="40" y="65" width="106" height="141" rx="10" fill="none" stroke="#e8e0d0" stroke-width="1.2"/>
  </g>

  <!-- ===== TEXTO ===== -->
  <text x="185" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="54" fill="url(#txtGrad)" letter-spacing="2">BADUY</text>
  <text x="185" y="158" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="27" fill="#1e6091" letter-spacing="9">ACADEMY</text>
  <line x1="185" y1="172" x2="600" y2="172" stroke="#0d1b2a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="600" cy="172" r="4.5" fill="#c9a227"/>
</svg>
